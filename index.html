<!DOCTYPE html>
<html>
<head>
<title>AUDMAX IA QUANTUM - CÉREBRO</title>
<meta charset="utf-8">
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
#cerebro{border:1px solid #0f0;padding:20px}
</style>
</head>
<body>
<div id="cerebro">
<h1>🧠 AUDMAX CÉREBRO - ONLINE</h1>
<p>Status: <span id="status">Carregando...</span></p>
<p>QGIS: <span id="qgis">--</span> | CapCut: <span id="capcut">--</span></p>
<p>Último sonho: <span id="last">--</span></p>
<div id="sonhos"></div>
</div>
<script>
fetch('sinapses.json').then(r=>r.json()).then(d=>{
 document.getElementById('qgis').innerText=d.qgis
 document.getElementById('capcut').innerText=d.capcut
 document.getElementById('last').innerText=d.last
 document.getElementById('status').innerText='ONLINE 🟢'
})
</script>
</body>
</html>
