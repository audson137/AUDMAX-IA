<script>
function openTab(id){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(event && event.currentTarget) event.currentTarget.classList.add('active');
 window.scrollTo({top:0,behavior:'smooth'});
}
let contadorMsgs = parseInt(localStorage.getItem('audmax_contador') || '0');
function atualizarContador(){document.getElementById('contador').innerText = contadorMsgs + '/100';}
function salvarChave(){
 const k=document.getElementById('apiKeyInput').value.trim();
 if(!k.startsWith('sk-')){document.getElementById('keyStatus').innerText='❌ Chave inválida, deve começar com sk-';return;}
 localStorage.setItem('openai_key',k);
 document.getElementById('keyStatus').innerText='✅ Chave salva! Agora tem cérebro ativo!';
 document.getElementById('apiKeyInput').value='';
}
async function perguntar(){
 const inp=document.getElementById('pergunta');
 const txt=inp.value.trim();
 if(!txt) return;
 if(contadorMsgs >= 100){
  addMsg('🚨 LIMITE FREE 100 msgs atingido! Assine PRO R$19,90 para continuar ilimitado.','bot');
  return;
 }
 addMsg(txt,'user'); inp.value='';
 atualizarContador();
 const apiKey = localStorage.getItem('openai_key');
 if(!apiKey){
  let conta = txt.replace(/x/g,'*').replace(/X/g,'*').replace(/,/g,'.');
  if(/^[0-9+\-*/().\s]+$/.test(conta) && /[0-9]/.test(conta)){
   try{let r=Function('"use strict"; return ('+conta+')')(); addMsg('🧠 Cálculo local: '+txt+' = '+r,'bot'); contadorMsgs++; localStorage.setItem('audmax_contador',contadorMsgs); atualizarContador(); return;}catch(e){}
  }
  addMsg('⚠ Configure sua chave IA acima para ter cérebro IA real! Por enquanto modo local: ' + (txt.toLowerCase().includes('capital do brasil')? 'Brasília é a capital do Brasil desde 1960, planejada por Oscar Niemeyer e Lúcio Costa.' : 'Modo local ativo - coloque a chave IA para respostas profissionais.'),'bot');
  contadorMsgs++; localStorage.setItem('audmax_contador',contadorMsgs); atualizarContador();
  return;
 }
 addMsg('🧠 Pensando...','bot');
 try{
  const response = await fetch('https://api.openai.com/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
   body:JSON.stringify({
    model:'gpt-4o-mini',
    messages:[
     {role:'system',content:'Você é AUDMAX IA QUANTUM v4.1, cérebro quântico com 15 universidades (UCL Bartlett, NUS, MIT, Manchester, Columbia, Tokyo, TU Delft, ETH Zurich, Harvard, Berkeley, Tsinghua, Polimi, PUC Chile, TU Berlin, TUM) + 7 canais (Amazon audmax0d-20, CapCut, Pinterest, Instagram, TikTok, Facebook, Produtos 1-8) + QGIS GEO + Billing v1.4 + Chat Limpo. Responda de forma inteligente, útil. Se perguntarem capital do Brasil: Brasília. Se perguntarem 100x1000: 100000.'},
     {role:'user',content:txt}
    ],
    max_tokens:500,
    temperature:0.7
   })
  });
  const data = await response.json();
  document.querySelectorAll('.msg.bot').forEach(el=>{if(el.innerText.includes('Pensando')) el.remove()});
  if(data.error){addMsg('❌ Erro IA: '+data.error.message+' - Verifique sua chave e saldo $5','bot'); return;}
  const resposta = data.choices[0].message.content;
  addMsg(resposta,'bot');
  contadorMsgs++; localStorage.setItem('audmax_contador',contadorMsgs); atualizarContador();
 }catch(err){
  document.querySelectorAll('.msg.bot').forEach(el=>{if(el.innerText.includes('Pensando')) el.remove()});
  addMsg('❌ Erro conexão: '+err.message+' - Tente novamente.','bot');
 }
}
function addMsg(t,c){
 const d=document.createElement('div'); d.className='msg '+c; d.innerText=t;
 const box=document.getElementById('chatBox'); box.appendChild(d); box.scrollTop=99999;
}
document.addEventListener('DOMContentLoaded', () => {
 atualizarContador();
 const savedKey=localStorage.getItem('openai_key');
 if(savedKey) document.getElementById('keyStatus').innerText='✅ Cérebro Quântico conectado!';
 const cerebroCards = document.querySelectorAll('#cerebro.card');
  const infos = [
    { title: '2) CAPCUT - Integração em Destaque', text: 'Automação de vídeos via API.\n\n✅ Corte inteligente\n✅ Legendas automáticas\n✅ Templates virais\n✅ Postagem diária 06:00 BRT' },
    { title: 'Architecture • Urbanism • Design', text: 'Domínios principais:\n\n🏛 Bartlett UCL - London\n🏙 NUS - Singapore\n🏗 Manchester - UK\n🎨 Polimi - Milan' },
    { title: 'Technology • BaaS • SaaS • Quantum', text: 'Bank as a Service, SaaS, Física Quântica:\n\n⚛ Superposição\n🔗 Entrelaçamento\n🚀 Tunelamento\n\nSecure Compute + QKD BB84' },
    { title: '15 Domínios Ativos', text: 'TI Integrations • Chemical • Civil • Engineering • Law • Medicine • Languages • Mathematics π\n\nCada elétron girando = um domínio processando' }
  ];
  cerebroCards.forEach((card, i) => {
    if(infos[i]){
      card.onclick = () => {
        document.getElementById('modal-title').innerText = infos[i].title;
        document.getElementById('modal-text').innerText = infos[i].text;
        document.getElementById('modal').style.display = 'flex';
      };
    }
  });
});
</script>
