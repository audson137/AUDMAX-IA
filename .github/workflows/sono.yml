name: SONO AUDMAX V5.1
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: write
jobs:
  sono:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p knowledge
      - run: echo "# Sonho $(date +%Y-%m-%d) QGIS+CapCut Produto 9" > knowledge/sonho_$(date +%Y-%m-%d).md
      - run: echo '{"qgis":0.68,"capcut":0.53,"last":"'$(date -I)'"}' > sinapses.json
      - run: |
          git config user.name "AUDMAX SONO"
          git config user.email "sono@audmax.com"
          git add knowledge/ sinapses.json
          git commit -m "🧠 SONO $(date)" || true
          git push || true
